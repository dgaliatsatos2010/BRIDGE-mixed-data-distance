[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-mixed-data-distance"
version = "1.0.0"
description = "Bayesian Redundancy-Aware Information Distance with Graph Ensembles for Mixed-Type Data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3"
]
license = {text = "MIT"}

authors = [
    {name = "Dimitrios Galiatsatos", email = "galiatsatos.dimitrios@ac.eap.gr"}
]

keywords = [
    "mixed data",
    "distance metric",
    "redundancy",
    "Bayesian networks",
    "graph ensembles",
    "machine learning",
    "unsupervised learning"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/dgaliatsatos2010/BRIDGE-mixed-data-distance"
Repository = "https://github.com/dgaliatsatos2010/BRIDGE-mixed-data-distance"
Issues = "https://github.com/dgaliatsatos2010/BRIDGE-mixed-data-distance/issues"

[tool.setuptools.packages.find]
where = ["src"]